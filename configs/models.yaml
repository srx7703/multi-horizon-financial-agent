# Layered model routing. One file controls which Claude model handles each
# step of the agent loop. Lets us run cost/quality ablations and Phase 2
# A/B (Opus vs Multi-Horizon Gemma adapter) without code changes.

roles:
  planner:
    model: claude-sonnet-4-5
    max_tokens: 2000
    temperature: 0.0
    rationale: "Structured tool plan; quality plateaus before Opus, Sonnet is the cost/latency sweet spot."

  tool_synth:
    model: claude-sonnet-4-5
    max_tokens: 4000
    temperature: 0.2
    rationale: "Mid-loop per-document summarization. High call volume; Sonnet beats Opus on cost-per-summary."

  synthesizer:
    model: claude-opus-4-5
    max_tokens: 8000
    temperature: 0.3
    rationale: "User-facing final brief. This is what people read; quality drives entire project value."

  judge:
    model: claude-haiku-4-5
    max_tokens: 1000
    temperature: 0.0
    rationale: "LLM-as-judge for factuality eval. High-volume per-claim verification; Haiku is cost-optimal for well-scoped rubric."

  # Phase 2 — populated when Multi-Horizon adapter is served behind a vLLM endpoint.
